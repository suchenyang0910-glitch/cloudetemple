<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -9 127 215" opacity=".88">
  <defs>
    <radialGradient id="pd" cx="40%" cy="35%" r="62%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#f8b0b0"/>
      <stop offset="100%" stop-color="#b83838"/>
    </radialGradient>
  </defs>
  <!-- main branch -->
  <path d="M50 198 C50 170 45 138 42 108 C38 72 40 40 46 6" fill="none" stroke="#5a3a0f" stroke-width="4.5" stroke-linecap="round" opacity=".82"/>
  <!-- side branches -->
  <path d="M44 165 C30 152 12 148 2 144" fill="none" stroke="#5a3a0f" stroke-width="2.5" stroke-linecap="round" opacity=".76"/>
  <path d="M43 122 C60 110 78 105 91 98" fill="none" stroke="#5a3a0f" stroke-width="2" stroke-linecap="round" opacity=".74"/>
  <path d="M42 85 C26 73 14 68 6 60" fill="none" stroke="#5a3a0f" stroke-width="2" stroke-linecap="round" opacity=".72"/>
  <path d="M43 50 C55 38 65 30 77 20" fill="none" stroke="#5a3a0f" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
  <!-- peach flower: 5 round petals (rounder than mai) -->
  <!-- flower 1: bottom-left -->
  <g transform="translate(2,144)" opacity=".9">
    <circle cx="5" cy="-6" r="6" fill="#f0c0c0" opacity=".5"/>
    <circle cx="11" cy="1" r="6" fill="#f0c0c0" opacity=".5" transform="rotate(72,11,1)"/>
    <circle cx="8.5" cy="8.5" r="6" fill="#f0c0c0" opacity=".5" transform="rotate(144,8.5,8.5)"/>
    <circle cx="0.5" cy="8.5" r="6" fill="#f0c0c0" opacity=".5" transform="rotate(216,0.5,8.5)"/>
    <circle cx="-2" cy="1" r="6" fill="#f0c0c0" opacity=".5" transform="rotate(288,-2,1)"/>
    <circle cx="5" cy="-6" r="5.5" fill="url(#pd)" opacity=".82" stroke="#963030" stroke-width=".6"/>
    <circle cx="11" cy="1" r="5.5" fill="url(#pd)" opacity=".82" stroke="#963030" stroke-width=".6" transform="rotate(72,11,1)"/>
    <circle cx="8.5" cy="8.5" r="5.5" fill="url(#pd)" opacity=".8" stroke="#963030" stroke-width=".6" transform="rotate(144,8.5,8.5)"/>
    <circle cx="0.5" cy="8.5" r="5.5" fill="url(#pd)" opacity=".8" stroke="#963030" stroke-width=".6" transform="rotate(216,0.5,8.5)"/>
    <circle cx="-2" cy="1" r="5.5" fill="url(#pd)" opacity=".8" stroke="#963030" stroke-width=".6" transform="rotate(288,-2,1)"/>
    <circle cx="4.5" cy="2" r="3" fill="#7a3030"/>
  </g>
  <!-- flower 2: right branch -->
  <g transform="translate(91,98)" opacity=".88">
    <circle cx="3" cy="-5.5" r="5.2" fill="url(#pd)" opacity=".82" stroke="#963030" stroke-width=".5"/>
    <circle cx="9" cy="0.5" r="5.2" fill="url(#pd)" opacity=".82" stroke="#963030" stroke-width=".5" transform="rotate(72,9,0.5)"/>
    <circle cx="7" cy="7" r="5.2" fill="url(#pd)" opacity=".8" stroke="#963030" stroke-width=".5" transform="rotate(144,7,7)"/>
    <circle cx="0" cy="7" r="5.2" fill="url(#pd)" opacity=".8" stroke="#963030" stroke-width=".5" transform="rotate(216,0,7)"/>
    <circle cx="-2.5" cy="0.5" r="5.2" fill="url(#pd)" opacity=".8" stroke="#963030" stroke-width=".5" transform="rotate(288,-2.5,0.5)"/>
    <circle cx="3.5" cy="1.5" r="2.6" fill="#7a3030"/>
  </g>
  <!-- flower 3: left lower -->
  <g transform="translate(6,60)" opacity=".86">
    <circle cx="4" cy="-5" r="4.8" fill="url(#pd)" opacity=".8" stroke="#963030" stroke-width=".5"/>
    <circle cx="8.5" cy="1" r="4.8" fill="url(#pd)" opacity=".8" stroke="#963030" stroke-width=".5" transform="rotate(72,8.5,1)"/>
    <circle cx="6.5" cy="7" r="4.8" fill="url(#pd)" opacity=".78" stroke="#963030" stroke-width=".5" transform="rotate(144,6.5,7)"/>
    <circle cx="0" cy="7" r="4.8" fill="url(#pd)" opacity=".78" stroke="#963030" stroke-width=".5" transform="rotate(216,0,7)"/>
    <circle cx="-2" cy="1" r="4.8" fill="url(#pd)" opacity=".78" stroke="#963030" stroke-width=".5" transform="rotate(288,-2,1)"/>
    <circle cx="3.5" cy="1.5" r="2.4" fill="#7a3030"/>
  </g>
  <!-- flower 4: upper right -->
  <g transform="translate(77,20)" opacity=".85">
    <circle cx="3" cy="-4.5" r="4.5" fill="url(#pd)" opacity=".8" stroke="#963030" stroke-width=".5"/>
    <circle cx="8" cy="1" r="4.5" fill="url(#pd)" opacity=".8" stroke="#963030" stroke-width=".5" transform="rotate(72,8,1)"/>
    <circle cx="6" cy="6.5" r="4.5" fill="url(#pd)" opacity=".78" stroke="#963030" stroke-width=".5" transform="rotate(144,6,6.5)"/>
    <circle cx="0" cy="6.5" r="4.5" fill="url(#pd)" opacity=".78" stroke="#963030" stroke-width=".5" transform="rotate(216,0,6.5)"/>
    <circle cx="-2" cy="1" r="4.5" fill="url(#pd)" opacity=".78" stroke="#963030" stroke-width=".5" transform="rotate(288,-2,1)"/>
    <circle cx="3" cy="1.5" r="2.2" fill="#7a3030"/>
  </g>
  <!-- flower 5: stem top -->
  <g transform="translate(46,6)" opacity=".84">
    <circle cx="2" cy="-4" r="4.2" fill="url(#pd)" opacity=".8" stroke="#963030" stroke-width=".5"/>
    <circle cx="6.5" cy="1" r="4.2" fill="url(#pd)" opacity=".8" stroke="#963030" stroke-width=".5" transform="rotate(72,6.5,1)"/>
    <circle cx="5" cy="6" r="4.2" fill="url(#pd)" opacity=".78" stroke="#963030" stroke-width=".5" transform="rotate(144,5,6)"/>
    <circle cx="-1" cy="6" r="4.2" fill="url(#pd)" opacity=".78" stroke="#963030" stroke-width=".5" transform="rotate(216,-1,6)"/>
    <circle cx="-2.5" cy="1" r="4.2" fill="url(#pd)" opacity=".78" stroke="#963030" stroke-width=".5" transform="rotate(288,-2.5,1)"/>
    <circle cx="2.5" cy="1.5" r="2.1" fill="#7a3030"/>
  </g>
  <!-- buds -->
  <ellipse cx="20" cy="152" rx="3.2" ry="5" fill="url(#pd)" opacity=".72" stroke="#963030" stroke-width=".6" transform="rotate(-15,20,152)"/>
  <ellipse cx="66" cy="114" rx="3" ry="4.5" fill="url(#pd)" opacity=".7" stroke="#963030" stroke-width=".6" transform="rotate(10,66,114)"/>
</svg>
