:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#152019;font:14px system-ui,sans-serif;color:#f5efdf}canvas{touch-action:none;display:block;width:100vw;height:100vh}.top{position:fixed;z-index:3;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border:1px solid #87917d;border-radius:999px;background:rgba(23,31,25,.88)}button{font:inherit;cursor:pointer;color:#f5efdf;background:#334338;border:1px solid #75816e;border-radius:999px;padding:8px 11px}button[aria-selected="true"],button[aria-pressed="true"]{background:#caa76c;color:#211c12}.sample{position:fixed;z-index:2;left:12px;top:126px;padding:8px;border-radius:9px;background:rgba(23,31,25,.88);border:1px solid #87917d}.hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);max-width:min(720px,calc(100vw - 24px));padding:9px 14px;border:1px solid #87917d;border-radius:10px;background:rgba(23,31,25,.88);text-align:center}.hint small{display:block;color:#d2c9b5}.card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100vw - 32px));padding:18px;border-radius:14px;background:#f5eddd;color:#31241a;border:2px solid #a8865c;box-shadow:0 12px 38px rgba(0,0,0,.42);text-align:center}.card button{margin-top:12px;background:#5b765c;color:#fff}.stats{position:fixed;right:12px;bottom:12px;padding:7px 10px;border:1px solid #87917d;border-radius:8px;background:rgba(23,31,25,.85);font:12px ui-monospace,Consolas,monospace;white-space:pre}.transition{position:fixed;inset:0;display:grid;place-items:center;background:rgba(18,28,22,0);pointer-events:none;opacity:0;transition:opacity .32s}.transition.on{opacity:1;background:rgba(18,28,22,.72)}.dot{width:14px;height:14px;border-radius:50%;background:#ffe0a0;box-shadow:0 0 22px #ffe0a0;animation:breath 1.5s ease-in-out infinite}@keyframes breath{50%{transform:scale(1.8);opacity:.3}}@media(max-width:650px){.top{left:12px;right:12px;transform:none;justify-content:center}.top but </style><div class="top" role="tablist"><button role="tab" data-scene="lawn" aria-selected="true">Vườn cỏ nắng</button><button role="tab" data-scene="forest" aria-selected="false">Vườn rừng sương</button><button role="tab" data-scene="sea" aria-selected="false">Vườn biển sao</button></div><label class="sample"><input id="sample" type="checkbox"> Xem thử dữ liệu mẫu <small>Bản nháp · cần người bản ngữ kiểm tra</small></label><div class="hint" id="hint">Chạm đất để đi · Kéo để xoay · Hai ngón để phóng to<small>WASD · chuột · con lăn</small></div><div id="card" class="card" role="dialog" aria-modal="true" hidden></div><button id="daytime" style="position:fixed;right:12px;top:88px">Ngày / Đêm</button><div id="stats" class="stats">loading</div><div id="transition" class="transition"><i class="dot"></i></div>
<script type="module">

import * as THREE from './three.bundle.min.js';
import {disposeWorld} from './common.js';
import {buildLawnScene} from './scene-lawn.js';

const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,140),ray=new THREE.Raycaster(),pointer=new THREE.Vector2();scene.fog=new THREE.Fog(0x92a495,20,62);
const hemi=new THREE.HemisphereLight(0xe6efd9,0x42503c,1.45),sun=new THREE.DirectionalLight(0xffefd2,1.55);sun.position.set(-16,28,14);scene.add(hemi,sun);
const builders={lawn:buildLawnScene,forest:buildForestScene,sea:buildSeaScene},tabs=[...document.querySelectorAll('[data-scene]')],transition=document.querySelector('#transition'),hint=document.querySelector('#hint'),stats=document.querySelector('#stats'),card=document.querySelector('#card'),sampleToggle=document.querySelector('#sample'),daytime=document.querySelector('#daytime');
const actor=new THREE.Group(),skin=new THREE.MeshLambertMaterial({color:0xeac9a7}),cloth=new THREE.MeshLambertMaterial({color:0xdabf82}),legM=new THREE.MeshLambertMaterial({color:0x526a76});
const body=new THREE.Mesh(new THREE.CylinderGeometry(.18,.22,.65,10),cloth),head=new THREE.Mesh(new THREE.SphereGeometry(.17,10,8),skin);body.position.y=.8;head.position.y=1.3;actor.add(body,head);const legs=[];for(const x of [-.11,.11]){const leg=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.58,8),legM);leg.position.set(x,.29,0);legs.push(leg);actor.add(leg);const arm=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.5,8),cloth);arm.position.set(x*2.5,.83,0);actor.add(arm)}scene.add(actor);
let world=null,yaw=0,pitch=0,zoom=5.6,samples=false,night=false,sceneId='lawn',generation=0,route=[],last=performance.now(),elapsed=0;const keys={},touches=new Map();let gestureMoved=false,pinch=0;
function showCard(slot){card.replaceChildren();const title=document.createElement('b'),p=document.createElement('p'),draft=document.createElement('small'),close=document.createElement('button');title.textContent=slot.sample?'Mẫu · Thú cưng':'Nơi này còn trống';p.textContent=slot.sample?'Mẫu minh họa · Không phải dữ liệu thật.':'Nơi này còn trống.';draft.textContent='Bản nháp · cần người bản ngữ kiểm tra';close.textContent='Đóng';close.onclick=()=>card.hidden=true;card.append(title,p,draft);if(slot.sample){const offer=document.createElement('button'),comment=document.createElement('p');offer.textContent='Hoa · Chỉ minh họa';offer.disabled=true;comment.textContent='Lời nhắn · Chưa mở';card.append(document.createElement('br'),offer,comment)}card.append(document.createElement('br'),close);card.hidden=false;close.focus()}
function lighting(){const dark=sceneId==='sea'||night;scene.background=new THREE.Color(sceneId==='sea'?0x111a3b:dark?0x1b282b:sceneId==='forest'?0x657467:0xb9cdb2);scene.fog.color.set(sceneId==='sea'?0x303451:dark?0x263331:sceneId==='forest'?0x798a76:0xb0c4a3);hemi.intensity=dark?.8:1.45;sun.intensity=dark?.32:1.55;daytime.disabled=sceneId==='sea';daytime.setAttribute('aria-pressed',String(dark))}
async function switchScene(id){if(!builders[id])return;const token=++generation;transition.classList.add('on');card.hidden=true;await new Promise(r=>setTimeout(r,330));if(token!==generation)return;if(world)disposeWorld(world);world=builders[id](THREE);scene.add(world.g);sceneId=id;night=false;lighting();actor.position.copy(world.start);actor.position.y=world.floorY(actor.position.x,actor.position.z);yaw=0;pitch=0;zoom=5.6;route=[];world.setSamples(samples);tabs.forEach(b=>b.setAttribute('aria-selected',String(b.dataset.scene===id)));hint.innerHTML=world.hello+'<small>Bản nháp · cần người bản ngữ kiểm tra</small>';await new Promise(r=>setTimeout(r,220));if(token===generation)transition.classList.remove('on')}
tabs.forEach(b=>b.onclick=()=>switchScene(b.dataset.scene));sampleToggle.onchange=e=>{samples=e.target.checked;world?.setSamples(samples);card.hidden=true};daytime.onclick=()=>{night=!night;lighting()};
function eventPoint(e){const r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pointer,camera)}
function setTarget(x,z){route=world.route(actor.position,{x,z});return route.length>0}
renderer.domElement.addEventListener('pointerdown',e=>{touches.set(e.pointerId,{x:e.clientX,y:e.clientY});renderer.domElement.setPointerCapture(e.pointerId);if(touches.size===1)gestureMoved=false;if(touches.size===2){gestureMoved=true;const p=[...touches.values()];pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}});
renderer.domElement.addEventListener('pointermove',e=>{const prev=touches.get(e.pointerId);if(!prev)return;const dx=e.clientX-prev.x,dy=e.clientY-prev.y;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){const p=[...touches.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);zoom=THREE.MathUtils.clamp(zoom+(pinch-d)*.02,3.2,12);pinch=d}else{if(Math.abs(dx)+Math.abs(dy)>2)gestureMoved=true;yaw-=dx*.008;pitch=THREE.MathUtils.clamp(pitch-dy*.006,-.12,.65)}});
renderer.domElement.addEventListener('pointerup',e=>{if(!touches.has(e.pointerId))return;if(!gestureMoved&&touches.size===1&&world){eventPoint(e);const hit=ray.intersectObject(world.g.userData.memorials)[0];if(hit)showCard(world.memorialSlots[hit.instanceId]);else{const floor=ray.intersectObject(world.g.children.find(o=>o.name==='walk-ground'))[0];if(floor)setTarget(floor.point.x,floor.point.z)}}touches.delete(e.pointerId)});renderer.domElement.addEventListener('pointercancel',e=>touches.delete(e.pointerId));
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();zoom=THREE.MathUtils.clamp(zoom+e.deltaY*.006,3.2,12)},{passive:false});
addEventListener('keydown',e=>{if(e.key==='Escape')card.hidden=true;if('wasd'.includes(e.key.toLowerCase())&&e.key.length===1)keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>{for(const k of Object.keys(keys))keys[k]=false;touches.clear()});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
let frames=0,wallTime=0,fps=0;
function frame(){const now=performance.now(),raw=(now-last)/1000,dt=Math.min(.05,raw);last=now;elapsed+=dt;
 if(world){let dx=Number(!!keys.d)-Number(!!keys.a),dz=Number(!!keys.s)-Number(!!keys.w),moving=false;if(card.hidden&&(dx||dz)){const l=Math.hypot(dx,dz);dx*=dt*2.8/l;dz*=dt*2.8/l;const next={x:actor.position.x+dx,z:actor.position.z+dz};if(world.segment(actor.position,next)){actor.position.x=next.x;actor.position.z=next.z;moving=true}route=[]}else if(card.hidden&&route.length){const p=route[0],d=Math.hypot(p.x-actor.position.x,p.z-actor.position.z),step=Math.min(dt*2.8,d);if(d<.02)route.shift();else{const next={x:actor.position.x+(p.x-actor.position.x)*step/d,z:actor.position.z+(p.z-actor.position.z)*step/d};if(world.segment(actor.position,next)){actor.position.x=next.x;actor.position.z=next.z;moving=true}else route=[]}}actor.position.y=world.floorY(actor.position.x,actor.position.z);legs.forEach((l,i)=>l.rotation.x=moving?Math.sin(elapsed*8+i*Math.PI)*.25:0);world.tick(dt)}
 const x=actor.position.x+Math.sin(yaw)*Math.cos(pitch)*zoom,z=actor.position.z+Math.cos(yaw)*Math.cos(pitch)*zoom;
 camera.position.set(x,Math.max(actor.position.y+1.65+Math.sin(pitch)*zoom,(world?.floorY(x,z)||0)+1),z);camera.lookAt(actor.position.x,actor.position.y+1,actor.position.z);renderer.render(scene,camera);frames++;wallTime+=raw;if(wallTime>.8){fps=frames/wallTime;frames=0;wallTime=0}stats.textContent=(world?.title||'')+'\n'+renderer.info.render.triangles.toLocaleString()+' triangles · '+renderer.info.render.calls+' draws\n'+fps.toFixed(0)+' fps';requestAnimationFrame(frame)}
window.__petgarden={renderer,scene,camera,actor,switchScene,world:()=>world,tests:()=>world.selfTest(),metrics:()=>({triangles:renderer.info.render.triangles,calls:renderer.info.render.calls}),setTarget,controls:()=>({yaw,pitch,zoom}),setPose:(x,z,a=0,p=0,d=5.6)=>{actor.position.set(x,world.floorY(x,z),z);route=[];yaw=a;pitch=p;zoom=d},showCard};
await switchScene('lawn');last=performance.now();frame();
