server {
  listen 127.0.0.1:8801;
  server_name miniapp.chuamay.org;
  root /opt/chuamay/production/current/dist;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cloudflareinsights.com https://api.chuamay.org; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors https://web.telegram.org; form-action 'self'" always;
  
  location / { add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cloudflareinsights.com https://api.chuamay.org; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors https://web.telegram.org; form-action 'self'" always; add_header Cache-Control "no-cache" always; try_files $uri $uri.html $uri/ =404; }
  location ^~ /assets/ { auth_basic off; add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cloudflareinsights.com https://api.chuamay.org; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors https://web.telegram.org; form-action 'self'" always; add_header Cache-Control "public, max-age=31536000, immutable"; types { image/webp webp; image/png png; application/json json; text/plain txt md; audio/mp4 m4a; audio/mpeg mp3; } try_files $uri =404; }
  location ~ "^/[a-z0-9-]+\.[a-f0-9]{12}\.(js|css)$" { auth_basic off; add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cloudflareinsights.com https://api.chuamay.org; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors https://web.telegram.org; form-action 'self'" always; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  
}
