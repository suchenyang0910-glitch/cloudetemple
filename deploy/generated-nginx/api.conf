server {
  listen 127.0.0.1:8802;
  server_name api.chuamay.org;
  root /opt/chuamay/production/current/dist;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' ; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.chuamay.org; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  
  location / { proxy_pass http://127.0.0.1:8790;
      proxy_set_header X-Chuamay-Peer $http_x_chuamay_peer;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip; }
  
}
