server {
  listen 127.0.0.1:8803;
  server_name staging.chuamay.org;
  root /opt/chuamay/staging/current/dist;
  error_page 404 /404.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://www.googletagmanager.com https://telegram.org; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src https://*.google-analytics.com https://www.googletagmanager.com 'self' data: blob:; connect-src https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com 'self' https://cloudflareinsights.com https://api.chuamay.org; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  auth_basic "Chua May staging"; auth_basic_user_file /etc/chuamay/staging.htpasswd;
  add_header X-Robots-Tag noindex always;
  location = /404.html { internal; }
  location / { add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://www.googletagmanager.com https://telegram.org; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src https://*.google-analytics.com https://www.googletagmanager.com 'self' data: blob:; connect-src https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com 'self' https://cloudflareinsights.com https://api.chuamay.org; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Robots-Tag noindex always; add_header Cache-Control "no-cache" always; try_files $uri $uri.html $uri/ =404; }
  location ^~ /assets/ { auth_basic off; add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://www.googletagmanager.com https://telegram.org; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src https://*.google-analytics.com https://www.googletagmanager.com 'self' data: blob:; connect-src https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com 'self' https://cloudflareinsights.com https://api.chuamay.org; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Robots-Tag noindex always; add_header Cache-Control "public, max-age=31536000, immutable"; types { image/webp webp; image/png png; image/svg+xml svg; application/json json; text/plain txt md; audio/mp4 m4a; audio/mpeg mp3; font/woff2 woff2; } try_files $uri =404; }
  location ~ "^/[a-z0-9-]+\.[a-f0-9]{12}\.(js|css)$" { auth_basic off; add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://www.googletagmanager.com https://telegram.org; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src https://*.google-analytics.com https://www.googletagmanager.com 'self' data: blob:; connect-src https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com 'self' https://cloudflareinsights.com https://api.chuamay.org; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Robots-Tag noindex always; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /api/ { proxy_pass http://127.0.0.1:8791/;
      proxy_set_header X-Chuamay-Peer $http_x_chuamay_peer;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip; }
  # Telegram cannot supply browser Basic Auth; this one route uses the webhook secret instead.
  location = /api/telegram/webhook { auth_basic off; proxy_pass http://127.0.0.1:8791/telegram/webhook;
      proxy_set_header X-Chuamay-Peer $http_x_chuamay_peer;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip; }
}
