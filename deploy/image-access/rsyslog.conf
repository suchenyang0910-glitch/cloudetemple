module(load="imuxsock" SysSock.Use="off")
input(type="imuxsock" Socket="/opt/chuamay/nginx-production/sites/.ct-access.sock")
template(name="ctMsg" type="string" string="%msg:::drop-last-lf%\n")
if $programname == 'ctweb' then action(type="omfile" file="/var/log/chuamay-web/access.log" template="ctMsg" fileCreateMode="0600")
