# Included at http scope, ahead of the two production vhosts.
map $http_cf_connecting_ip $ct_ip {
    default "-";
    "~^([0-9]{1,3}\.[0-9]{1,3})\.[0-9]{1,3}\.[0-9]{1,3}$" $1;
    "~*^([0-9a-f]{1,4}:[0-9a-f]{1,4}):[0-9a-f:]+$" $1;
}
map $http_user_agent $ct_ua {
    default "-";
    "~^([ -~]{1,80})" $1;
}
map $request_uri $ct_path {
    default "/";
    "~^([^?]+)" $1;
}
log_format ct_image escape=json '{"time":"$time_iso8601","path":"$ct_path","status":$status,"bytes":$body_bytes_sent,"seconds":$request_time,"ua":"$ct_ua","ip":"$ct_ip"}';
