server {
  listen 127.0.0.1:8804;
  server_name adminchy-staging.chuamay.org;
  root /opt/chuamay/staging/current/dist;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
  location = / { add_header Cache-Control "no-store" always; try_files /admin.html =404; }
  location /api/ {
    proxy_pass http://127.0.0.1:8791/admin/;
    proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
    proxy_set_header X-Chuamay-Peer $remote_addr;
  }
  location ~ "^/[a-z0-9-]+\.[a-f0-9]{12}\.(js|css)$" { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location ^~ /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { return 404; }
}
