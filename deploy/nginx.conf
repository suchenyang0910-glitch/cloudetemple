worker_processes 1;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 15s;
    send_timeout 15s;
    include /etc/nginx/chuamay-sites/*.conf;
}
