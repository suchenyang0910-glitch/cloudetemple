<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Lịch Gia Đình Chùa Mây 2027</title><link rel="stylesheet" href="calendar-presale.css"><script type="module" src="calendar-presale.js?v=p56"></script></head>
<body><main>
<a href="/family.html">← Bàn thờ gia tiên</a>
<header><p>CHÙA MÂY · BẢN THỬ NGHIỆM</p><h1>Lịch Gia Đình Chùa Mây 2027</h1><p>Ghi dấu ngày giỗ, lưu giữ ký ức gia đình.</p><span>Ảnh minh họa</span></header>
<section id="sale"><h2>Đặt trước</h2><p id="sale-status" role="status">Đang kiểm tra thời gian mở bán…</p><div id="sale-details" hidden></div>
<form id="order" hidden>
<label>Gói<select name="edition"><option value="basic">Bản cơ bản</option><option value="family">Bản gia đình</option></select></label>
<label>Tên gia đình<input name="familyName" maxlength="100" required></label>
<label>Zalo hoặc điện thoại<input name="contact" maxlength="100" required></label>
<label>Ngày giỗ, mỗi dòng: Tên | Ngày<input type="button" id="import" value="Nhập từ bài vị" hidden><textarea name="anniversaries" rows="6" maxlength="1600" required></textarea></label>
<label class="agree"><input name="agree" type="checkbox" required> Tôi đồng ý dùng tên, ngày giỗ và thông tin liên hệ để làm và gửi lịch điện tử. Tôi có thể yêu cầu xóa sau khi nhận lịch.</label>
<button>Đặt trước</button></form><p id="order-result" role="status"></p></section>
<section><h2>Bạn quan tâm đến Gói Gia đình Chùa Mây?</h2><strong>Chưa thu phí — chỉ đăng ký quan tâm. Không cam kết, không tính tiền.</strong>
<form id="interest">
<label>Tên (không bắt buộc)<input name="name" maxlength="80"></label>
<label>Zalo hoặc điện thoại<input name="contact" maxlength="100" required></label>
<label>Số người thân<select name="ancestorCount"><option value="1-2">1–2</option><option value="3-5">3–5</option><option value="6-10">6–10</option><option value="10+">Trên 10</option></select></label>
<label>Mức phí có thể cân nhắc<select name="willingness"><option value="under-50">Dưới 50.000₫/tháng</option><option value="50-99">50.000–99.000₫/tháng</option><option value="100+">Từ 100.000₫/tháng</option><option value="none">Chưa cân nhắc</option></select></label>
<label>Khu vực<select name="region"><option value="">Không trả lời</option><option value="viet-nam">Việt Nam</option><option value="asia">Châu Á ngoài Việt Nam</option><option value="other">Âu, Mỹ, Úc</option></select></label>
<label class="agree"><input name="agree" type="checkbox" required> Tôi đồng ý để Chùa Mây lưu thông tin liên lạc nhằm thông báo khi Gói Gia đình sẵn sàng. Không chia sẻ với bên thứ ba; có thể yêu cầu xóa bất kỳ lúc nào.</label>
<button>Đăng ký quan tâm</button></form><p id="interest-result" role="status"></p></section>
</main></body></html>
