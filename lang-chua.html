<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f0e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1710" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta property="og:title" content="Làng Chùa · 云寺小镇">
  <meta property="og:description" content="Khám phá 7 ngôi chùa, trải nghiệm nghi lễ và gửi thiệp chúc mừng Tết.">
  <meta property="og:type" content="website">
  <title>Làng Chùa · 云寺小镇</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/lang-chua.css">
</head>

<!-- data-festival / data-period / data-view / data-tier set by lang-chua.js on init -->
<body data-period="day" data-view="map" data-tier="mid">

<!-- ══════════════════════════════════════════════════════════════
     MAP VIEW
════════════════════════════════════════════════════════════════ -->
<div id="map-view">
  <header id="map-header">
    <h1>Làng Chùa <span class="cn">云寺小镇</span></h1>
    <button id="settings-btn" aria-label="Cài đặt 设置">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <div id="map-scroll">
    <!-- Row 1 -->
    <div class="temple-row">
      <div class="temple-card" data-temple="diatang" data-state="coming_soon">
        <div class="card-thumb">
          <span class="card-lock">🔒</span>
        </div>
        <div class="card-name">Chùa Địa Tạng</div>
        <div class="card-name-cn">地藏寺</div>
        <div class="card-tooltip">即将开放</div>
      </div>
      <div class="temple-card" data-temple="lienchi" data-state="coming_soon">
        <div class="card-thumb">
          <span class="card-lock">🔒</span>
        </div>
        <div class="card-name">Chùa Liên Trì</div>
        <div class="card-name-cn">莲池寺</div>
        <div class="card-tooltip">即将开放</div>
      </div>
    </div>

    <div class="river-label">~~ sông ~~</div>

    <!-- Row 2 (open temples) -->
    <div class="temple-row">
      <div class="temple-card" data-temple="chuamay" data-state="open">
        <div class="card-thumb">☁️</div>
        <span class="festival-badge">🎊</span>
        <div class="card-name">Chùa Mây</div>
        <div class="card-name-cn">云寺</div>
        <div class="card-tooltip"></div>
      </div>
      <div class="temple-card" data-temple="dilac" data-state="open">
        <div class="card-thumb">😊</div>
        <span class="festival-badge">🎊</span>
        <div class="card-name">Chùa Di Lặc</div>
        <div class="card-name-cn">弥勒寺</div>
        <div class="card-tooltip"></div>
      </div>
    </div>

    <!-- Row 3 -->
    <div class="temple-row">
      <div class="temple-card" data-temple="quanam" data-state="coming_soon">
        <div class="card-thumb">
          <span class="card-lock">🔒</span>
        </div>
        <div class="card-name">Chùa Quan Âm</div>
        <div class="card-name-cn">海岸观音寺</div>
        <div class="card-tooltip">即将开放</div>
      </div>
      <div class="temple-card" data-temple="duocsu" data-state="coming_soon">
        <div class="card-thumb">
          <span class="card-lock">🔒</span>
        </div>
        <div class="card-name">Chùa Dược Sư</div>
        <div class="card-name-cn">药师寺</div>
        <div class="card-tooltip">即将开放</div>
      </div>
    </div>

    <!-- Row 4 -->
    <div class="temple-row">
      <div class="temple-card" data-temple="namtong" data-state="teaser">
        <div class="card-thumb">🏛️</div>
        <div class="card-name">Khu Nam Tông</div>
        <div class="card-name-cn">南传区</div>
        <div class="card-tooltip">敬请期待</div>
      </div>
    </div>
  </div><!-- /map-scroll -->

  <nav id="bottom-nav">
    <button class="nav-btn active" id="nav-map">
      <svg viewBox="0 0 24 24"><path d="M9 20l-5.447-2.724A1 1 0 0 1 3 16.382V5.618a1 1 0 0 1 1.447-.894L9 7m0 13V7m0 13 6-3M9 7l6-3m0 17 5.447-2.724A1 1 0 0 0 21 16.382V5.618a1 1 0 0 0-1.447-.894L15 7m0 14V7"/></svg>
      Bản đồ
    </button>
    <button class="nav-btn" id="nav-temple">
      <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span id="nav-temple-label">—</span>
    </button>
    <button class="nav-btn" id="nav-settings">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Cài đặt
    </button>
  </nav>
</div><!-- /map-view -->

<!-- ══════════════════════════════════════════════════════════════
     TEMPLE VIEW
════════════════════════════════════════════════════════════════ -->
<div id="temple-view">
  <header id="temple-header">
    <button id="back-btn" aria-label="Quay lại bản đồ 返回地图">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div id="temple-title">
      <div id="temple-name-vi"></div>
      <div id="temple-name-cn"></div>
    </div>
  </header>

  <div id="scene-stage">
    <!-- scene image injected by lang-chua.js -->
    <div id="scene-label"></div>
  </div>

  <div id="scene-controls">
    <!-- View toggle (hall-front / courtyard) — hidden on temples with single view -->
    <div id="view-tabs" class="view-tabs">
      <button class="view-tab active" data-view-target="hall-front">🏛 Chánh điện</button>
      <button class="view-tab" data-view-target="courtyard">🌳 Sân chùa</button>
    </div>

    <!-- Period tabs — hidden on low-tier devices via CSS -->
    <div class="period-tabs">
      <button class="period-tab active" data-period="day">☀️ Ban ngày</button>
      <button class="period-tab" data-period="dawn">🌅 Bình minh</button>
      <button class="period-tab" data-period="dusk">🌇 Hoàng hôn</button>
      <button class="period-tab" data-period="night">🌙 Ban đêm</button>
    </div>

    <!-- Weather sync opt-in — default OFF; tap to fetch live HCMC rain data -->
    <button id="weather-sync-btn" aria-label="Đồng bộ thời tiết 天气同步" aria-pressed="false">🌦 Thời tiết</button>

    <!-- Ritual list -->
    <div id="ritual-list">
      <button class="ritual-btn" data-ritual="incense">
        <span class="ritual-marker" id="marker-incense">○</span>
        <span class="ritual-label">Thắp hương 上香</span>
      </button>
      <button class="ritual-btn" data-ritual="bow">
        <span class="ritual-marker" id="marker-bow">○</span>
        <span class="ritual-label">Lễ Phật 礼拜</span>
      </button>
      <button class="ritual-btn" data-ritual="sit">
        <span class="ritual-marker" id="marker-sit">○</span>
        <span class="ritual-label">Ngồi thiền 静坐</span>
      </button>
      <button class="ritual-btn" data-ritual="mo">
        <span class="ritual-marker" id="marker-mo">○</span>
        <span class="ritual-label">Gõ mõ 木鱼</span>
      </button>
      <button class="ritual-btn" data-ritual="beads">
        <span class="ritual-marker" id="marker-beads">○</span>
        <span class="ritual-label">Lần tràng hạt 念珠</span>
      </button>
    </div>

    <!-- Greeting card entry — CSS shows only during Tết + dilac -->
    <button id="greeting-card-btn">🎊 Gửi thiệp chúc Tết · 送出贺卡</button>
  </div>
</div><!-- /temple-view -->

<!-- ══════════════════════════════════════════════════════════════
     RITUAL BOTTOM SHEET
════════════════════════════════════════════════════════════════ -->
<div id="ritual-panel" class="bottom-sheet" aria-hidden="true">
  <div class="sheet-drag-handle"></div>
  <div id="ritual-panel-content">
    <!-- populated by lang-chua.js per ritual type -->
  </div>
</div>
<div id="ritual-backdrop" class="backdrop"></div>

<!-- ══════════════════════════════════════════════════════════════
     GREETING CARD PANEL
════════════════════════════════════════════════════════════════ -->
<div id="card-panel" class="bottom-sheet full-sheet" aria-hidden="true">
  <div class="sheet-drag-handle"></div>
  <div id="card-panel-inner">
    <h2 id="card-panel-title">Thiệp chúc Tết · 新春贺卡</h2>

    <!-- Flower selector -->
    <div id="flower-selector"></div>

    <!-- Greeting picker -->
    <div id="greeting-picker"></div>

    <!-- Custom text -->
    <textarea id="card-custom-text" maxlength="60" placeholder="Lời chúc riêng (tối đa 60 chữ)…"></textarea>
    <div id="char-count">0 / 60</div>

    <!-- Canvas preview -->
    <canvas id="card-preview-canvas"></canvas>

    <!-- Actions -->
    <div id="card-actions">
      <button id="card-share-btn">📤 Gửi / 分享</button>
      <button id="card-download-btn">⬇️ Tải về / 下载</button>
    </div>

    <button id="card-close-btn" aria-label="Đóng">✕</button>
  </div>
</div>
<div id="card-backdrop" class="backdrop"></div>

<!-- ══════════════════════════════════════════════════════════════
     MY-TEMPLE PROMPT (shown once after first ritual completion)
════════════════════════════════════════════════════════════════ -->
<div id="my-temple-prompt" aria-hidden="true">
  <p>Đặt làm chùa của bạn? · 设为常去的寺？</p>
  <button id="my-temple-yes">设为</button>
  <button id="my-temple-skip">跳过</button>
</div>

<!-- ══════════════════════════════════════════════════════════════
     SETTINGS PANEL
════════════════════════════════════════════════════════════════ -->
<div id="settings-panel" class="bottom-sheet" aria-hidden="true">
  <div class="sheet-drag-handle"></div>
  <div id="settings-panel-content">
    <h2>Cài đặt · 设置</h2>
    <label id="weather-sync-label" class="settings-row">
      <span class="settings-row-text">
        <strong>Thời tiết thực · 实时天气</strong>
        <small>Đồng bộ thời tiết TP.HCM (mặc định tắt) · 同步胡志明市天气（默认关闭）</small>
      </span>
      <input type="checkbox" id="weather-sync-toggle" role="switch" aria-checked="false">
    </label>
    <button id="settings-close-btn" aria-label="Đóng">✕</button>
  </div>
</div>
<div id="settings-backdrop" class="backdrop"></div>

<script type="module" src="/lang-chua.js"></script>
</body>
</html>
