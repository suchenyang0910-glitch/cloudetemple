<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>大殿坐垫阵列试验（占位）</title>
  <style>
    :root { color-scheme: light; font: 14px/1.45 system-ui, sans-serif; color: #28241f; background: #e8e0d2; }
    body { margin: 0; min-height: 100vh; }
    main { max-width: 760px; margin: auto; padding: 14px; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    .note { margin: 0 0 10px; color: #62584c; }
    .controls { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; padding: 10px; background: #f5efe5; border: 1px solid #b8aa97; }
    label { display: grid; gap: 3px; font-size: 12px; color: #62584c; }
    select, button { min-height: 38px; border: 1px solid #75604a; background: #fffaf2; color: #28241f; border-radius: 4px; padding: 6px 8px; font: inherit; }
    button { background: #66503c; color: white; cursor: pointer; }
    canvas { display: block; width: 100%; height: min(72vh, 700px); margin-top: 10px; border: 1px solid #b8aa97; background: #ccd4c8; }
    pre { white-space: pre-wrap; margin: 10px 0 0; padding: 10px; background: #f5efe5; border: 1px solid #b8aa97; }
  </style>
</head>
<body>
  <main>
    <h1>大殿坐垫阵列与镜头试验（占位）</h1>
    <p class="note">占位几何：佛、佛台、供桌、香炉与坐垫。相机只在佛前方，行走范围不进入佛后方。</p>
    <section class="controls">
      <label>排法<select id="layout"><option value="10x10">10×10</option><option value="8x13">8×13（中轴走道）</option><option value="12x9">12×9（中轴+两侧走道）</option></select></label>
      <label>人所在排<select id="seat"><option value="first">第一排</option><option value="middle">中间排</option><option value="last">最后一排</option></select></label>
      <button id="measure">测量 200 次</button>
    </section>
    <canvas id="hall" aria-label="大殿坐垫阵列占位试验"></canvas>
    <pre id="readout">准备就绪。</pre>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
