<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>3D 人物小样</title><style>:root{font:14px/1.4 system-ui,sans-serif;color:#302b26;background:#e8e0d2}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:12px}h1{font-size:20px;margin:0 0 4px}.note{color:#62584d;margin:0 0 8px}.bar{display:flex;flex-wrap:wrap;gap:6px}.bar button{min-height:38px;padding:7px 9px;border:1px solid #705b46;border-radius:4px;background:#68513d;color:white}.bar button.active{background:#a76d49}canvas{width:100%;height:min(68vh,620px);display:block;margin-top:8px;background:#ccd5ca;border:1px solid #b5a58f}pre{white-space:pre-wrap;background:#f5eee3;border:1px solid #b5a58f;padding:8px}</style></head><body><main><h1>3D 人物模型可行性小样</h1><p class="note">一位成年越南女性占位模型：低面数、平涂、低发髻、米白 áo bà ba、深棕宽裤。旁边是现有纸片帧。</p><div class="bar"><button data-mode="front">正面</button><button data-mode="side">侧面</button><button data-mode="back">背面</button><button data-mode="walk">走路</button><button data-mode="palms">合掌</button><button data-mode="incense">持香拜</button></div><canvas id="view"></canvas><pre id="readout"></pre></main><script type="module" src="./app.js"></script></body></html>
