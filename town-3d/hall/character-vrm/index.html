<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VRM 人物加载与动作准备</title><style>:root{font:14px/1.4 system-ui,sans-serif;color:#302b26;background:#e6ddcf}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:12px}h1{font-size:20px;margin:0}.note{color:#5c5147;margin:4px 0 8px}.bar{display:flex;flex-wrap:wrap;gap:6px}.bar button,.bar input{min-height:38px;padding:7px 9px;border:1px solid #705b46;border-radius:5px}.bar button{background:#684d3a;color:#fff}.bar button.active{background:#b66f43}canvas{width:100%;height:min(65vh,620px);display:block;margin-top:8px;border:1px solid #ad9a84;background:#d9d2c4}pre{white-space:pre-wrap;background:#f6efe4;border:1px solid #ad9a84;padding:8px}</style></head><body><main><h1>VRM 人物加载与动作准备</h1><p class="note">等待模型文件 · 不内置 VRoid 示例角色。通过 <code>?model=路径</code> 指定 .vrm。</p><div class="bar"><input id="model" placeholder="model=路径（可选）"><button id="load">加载模型</button><button data-pose="idle">站立呼吸</button><button data-pose="walk">走路循环</button><button data-pose="palms">合掌</button><button data-pose="incense">持三炷香拜</button><button data-pose="kneel">跪拜</button><button data-pose="sit">盘坐</button></div><canvas id="view"></canvas><pre id="readout"></pre></main><script type="module" src="./app.js"></script></body></html>
