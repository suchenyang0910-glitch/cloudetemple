<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动漫风格 3D 人物演示</title><style>:root{font:14px/1.4 system-ui,sans-serif;color:#302b26;background:#e6ddcf}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:12px}h1{font-size:20px;margin:0}.note{margin:4px 0 8px;color:#5c5147}.bar{display:flex;flex-wrap:wrap;gap:6px}.bar button{min-height:38px;padding:6px 9px;border:1px solid #705b46;border-radius:5px;background:#684d3a;color:#fff}.bar button.active{background:#b66f43}canvas{width:100%;height:min(65vh,620px);display:block;margin-top:8px;border:1px solid #ad9a84;background:#d9d2c4}pre{white-space:pre-wrap;background:#f6efe4;border:1px solid #ad9a84;padding:8px}</style></head><body><main><h1>原创动漫风格 3D 访客</h1><p class="note">成年越南女性 · 米白 áo bà ba · 深棕宽裤 · 低发髻。左侧 3D，右侧为现有纸片帧对照。</p><div class="bar"><button data-mode="front">正面</button><button data-mode="three">3/4 侧</button><button data-mode="back">背面</button><button data-mode="walk1">走路 1</button><button data-mode="walk2">走路 2</button><button data-mode="palms">合掌</button><button data-mode="incense">持香拜</button><button data-mode="kneel">跪拜</button><button data-mode="sit">盘坐</button></div><canvas id="view"></canvas><pre id="readout"></pre></main><script type="module" src="./app.js"></script></body></html>
