<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>云寺大殿（占位）</title>
<style>
:root{font:14px/1.4 system-ui,sans-serif;color:#29251f;background:#e7dfd1}*{box-sizing:border-box}[hidden]{display:none!important}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}#app{position:relative}canvas{display:block;width:100%;height:100%;background:#cdd6ca}.ui{position:absolute;inset:10px 10px auto;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}.ui>*{pointer-events:auto}.chip,.btn{border:1px solid #76604a;background:#f8f0e4;color:#29251f;border-radius:4px;padding:7px 9px;min-height:38px}.btn{background:#67503b;color:#fff;cursor:pointer}.btn:disabled{opacity:.55}.fps{margin-left:auto;background:#f8f0e4;color:#51483e}.panel{position:absolute;left:10px;right:10px;bottom:10px;padding:10px;background:#f7efe4eF;border:1px solid #b9aa94;display:grid;gap:7px}.panel p{margin:0}.actions{display:flex;gap:6px;flex-wrap:wrap}.status{position:absolute;inset:0;display:grid;place-items:center;background:#e7dfd1;color:#5a5044}.status.ready{display:none}.fallback{position:absolute;inset:0;display:grid;place-items:center;background:#e7dfd1;padding:20px;text-align:center}
</style></head><body><main id="app"><canvas id="scene" aria-label="云寺大殿占位场景"></canvas><div class="ui"><span class="chip">佛堂一期 · 占位</span><button id="fps" class="chip fps">FPS: --</button></div><section class="panel"><p id="state">进殿前：从云寺门口进入</p><div class="actions"><button class="btn" id="enter">进入殿</button><button class="btn" id="front">一键到佛前</button><button class="btn" id="incense">开始上香</button><button class="btn" id="back">回到寺门</button><button class="btn" id="next" hidden>下一步</button></div></section><div id="status" class="status">正在打开大殿占位场景…</div><div id="fallback" class="fallback" hidden>设备未能打开 WebGL 大殿。请返回 2D 殿内。</div></main><script type="module" src="./app.js"></script></body></html>
