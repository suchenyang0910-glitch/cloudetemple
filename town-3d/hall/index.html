<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chánh điện · Lễ bái</title><style>:root{font:14px/1.4 system-ui,sans-serif;color:#29251f;background:#e7dfd1}*{box-sizing:border-box}[hidden]{display:none!important}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}#app{position:relative}canvas{display:block;width:100%;height:100%;background:#cbd5c9}.top,.panel{position:absolute;left:10px;right:10px;background:#f7efe4ed;border:1px solid #b9aa94;padding:9px}.top{top:10px;display:flex;gap:6px}.chip,.btn{border:1px solid #76604a;border-radius:4px;padding:7px 9px;min-height:38px}.chip{background:#f8f0e4}.panel{bottom:10px;display:grid;gap:7px}.panel p{margin:0}.actions{display:flex;gap:6px;flex-wrap:wrap}.btn{background:#67503b;color:#fff}.fallback{position:absolute;inset:0;display:grid;place-items:center;background:#e7dfd1;padding:20px;text-align:center}</style></head><body><main id="app"><canvas id="scene" aria-label="Chánh điện 3D"></canvas><div class="top"><span class="chip">Chánh điện · 100 bồ đoàn</span><span id="fps" class="chip">FPS: --</span></div><section class="panel"><p id="state">Bấm “Vào chánh điện” để bắt đầu.</p><div class="actions"><button class="btn" id="enter">Vào chánh điện</button><button class="btn" id="front" hidden>Đến trước Phật</button><button class="btn" id="bow" hidden>Bắt đầu lạy</button><button class="btn" id="next" hidden>Tiếp tục</button><button class="btn" id="finish" hidden>Hoàn tất lễ bái</button><button class="btn" id="back" hidden>Về cửa chùa</button></div></section><div id="fallback" class="fallback" hidden>Thiết bị không mở được WebGL. Hãy dùng chánh điện 2D.</div></main><script type="module" src="./app.js"></script></body></html>
