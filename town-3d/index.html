<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#d9d3c6">
  <title>Thị trấn Mây · 3D</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" aria-label="Thị trấn Mây với chín địa điểm">
    <canvas id="scene" aria-label="Bản đồ Thị trấn Mây 3D với chín địa điểm"></canvas>

    <header class="title">
      <p>THỊ TRẤN MÂY</p>
      <div class="title-right">
        <button id="map-toggle" class="mapbtn" aria-pressed="false">Bản đồ</button>
        <a href="../index.html" class="link2d">Bản 2D</a>
      </div>
    </header>

    <section id="temple-panel" class="panel" aria-live="polite" hidden>
      <h2 id="temple-name"></h2>
      <p id="temple-state"></p>
      <a id="temple-enter" class="enter" href="#" hidden>Vào chùa</a>
    </section>

    <div id="labels" class="labels-layer" aria-hidden="true"></div>

    <section id="map-sheet" class="map-sheet" aria-label="Sơ đồ chín địa điểm" hidden>
      <div class="map-sheet-head"><strong>Sơ đồ thị trấn</strong><span>Chọn nơi đang mở để đi tới</span></div>
      <div id="map-grid" class="map-grid"></div>
    </section>

    <div class="hint" id="walk-hint"><span>Chạm nền để đi</span><span>Giữ và kéo để đi tiếp</span></div>

    <div id="status" class="status" role="status">Đang mở thị trấn…</div>
    <div id="fallback" class="fallback" hidden>
      <h2>Thiết bị chưa mở được không gian 3D</h2>
      <p>Bản 2D của Chùa Mây vẫn dùng được trên thiết bị này.</p>
      <a class="enter" href="../index.html">Mở bản 2D</a>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
